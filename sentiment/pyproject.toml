[project]
name = "xev-sentiment"
version = "0.1.0"
description = "Post-train a Chinese sentiment classifier from Qwen3.5-4B-Base with a Kev-style pointer head"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "transformers==5.17.0",
    "peft==0.21.0",
    "accelerate==1.15.0",
    "datasets==5.0.1",
    # Gated DeltaNet kernels for Qwen3.5; without them transformers falls back to slow reference code
    "flash-linear-attention==0.5.2",
    # the DeltaNet short convolution's CUDA kernel (prebuilt for torch 2.8 / CUDA 12 / Python 3.12)
    "causal-conv1d @ https://github.com/Dao-AILab/causal-conv1d/releases/download/v1.7.0/causal_conv1d-1.7.0%2Bcu12torch2.8cxx11abiTRUE-cp312-cp312-linux_x86_64.whl",
    "numpy",
    "fastapi",
    "uvicorn",
]

[tool.uv]
# everything runs inside WSL (Linux): the CUDA torch wheels and the DeltaNet kernels are Linux-only
environments = ["sys_platform == 'linux'"]
